name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        run: node scripts/verify-release.mjs "${{ github.ref_name }}"

      - name: Check and build
        run: |
          npm run check
          npm run build
          npm test

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Package VS Code extension
        run: npm run package --workspace vscode-extension

      - name: Publish npm package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if npm view "guito@$VERSION" version >/dev/null 2>&1; then
            echo "guito@$VERSION is already published; skipping."
          else
            npm publish --access public
          fi

      - name: Publish VS Code extension
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --skip-duplicate --packagePath guito.vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; skipping."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Guito ${RELEASE_TAG#v}"
          fi
