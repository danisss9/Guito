<div class="app">
  <header class="titlebar">
    <div class="brand" aria-label="Repository logo">
      <svg class="logo" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4.5 2.5v11" stroke="#3794ff" stroke-width="1.6" fill="none" />
        <path d="M4.5 11.5c4.5 0 4.5-7 7.5-7" stroke="#4ec9b0" stroke-width="1.6" fill="none" />
        <circle cx="4.5" cy="3.5" r="1.7" fill="#3794ff" />
        <circle cx="4.5" cy="8" r="1.7" fill="#3794ff" />
        <circle cx="4.5" cy="12.5" r="1.7" fill="#3794ff" />
        <circle cx="12" cy="4.5" r="1.7" fill="#4ec9b0" />
      </svg>
      <span class="title">Guito</span>
    </div>
  </header>

  <app-toolbar
    [branches]="branches()"
    [selectedBranch]="selectedBranch()"
    [showRemote]="showRemote()"
    [busy]="busy() || mutationBusy() || statusLoading()"
    (branchChange)="selectedBranch.set($event)"
    (remoteToggle)="onRemoteToggle($event)"
    (searchChange)="search.set($event)"
    (refresh)="refresh()"
    (remoteAction)="runRemoteAction($event)"
  />

  @if (error()) {
    <div class="error-banner">{{ error() }} <button type="button" (click)="refresh()" [disabled]="loading()">Retry</button></div>
  }
  @if (statusError() && selectedCommit()?.hash !== workingHash) {
    <div class="error-banner" role="alert">{{ statusError() }}
      <button type="button" (click)="refreshWorking()" [disabled]="statusLoading()">Retry status</button>
    </div>
  }

  <main class="content">
    <app-commit-table
      [commits]="displayedCommits()"
      [loadingLabel]="tableLoading()"
      [selectedHash]="selectedCommit()?.hash ?? ''"
      [search]="search()"
      [selectedBranch]="selectedBranch()"
      [showRemote]="showRemote()"
      [workingChanges]="workingChanges()"
      [unloaded]="unloadedCommits()"
      [historyLoading]="historyLoading()"
      (commitClick)="selectedCommit.set($event)"
      (contextMenu)="onContextMenu($event)"
      (loadMoreRequested)="loadMoreCommits()"
      (loadAllRequested)="loadAllCommits()"
    />
    @if (selectedCommit(); as commit) {
      @if (commit.hash === workingHash) {
        <app-working-panel [changes]="workingChanges()" [busy]="busy() || mutationBusy() || statusLoading()"
          [statusLoading]="statusLoading()" [statusError]="statusError()"
          [subject]="commitSubject()" [description]="commitDescription()"
          (subjectChange)="commitSubject.set($event)" (descriptionChange)="commitDescription.set($event)"
          (stageChange)="changeStage($event)" (commitRequested)="commitChanges()"
          (retry)="refreshWorking()" (closed)="selectedCommit.set(null)" />
      } @else {
        <app-commit-detail [commit]="commit" (closed)="selectedCommit.set(null)" />
      }
    }
  </main>

  <app-context-menu [menu]="contextMenuState()" (select)="onContextAction($event)" (closed)="contextMenuState.set(null)" />
  <app-prompt-dialog [state]="promptState()" (confirmed)="onPromptConfirm($event)" (cancelled)="promptState.set(null)" />

</div>
