@if (message() && !dismissed()) {
  <div
    class="error-banner"
    [class.closing]="closing()"
    role="alert"
    (animationend)="finishDismiss($event)"
  >
    <svg class="error-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="10" cy="10" r="7.5" />
      <path d="M10 6v4.5" stroke-linecap="round" />
      <circle cx="10" cy="13.5" r=".8" fill="currentColor" stroke="none" />
    </svg>
    <div class="error-content">
      <p>{{ message() }}</p>
      @if (retryLabel()) {
        <button class="retry" type="button" [disabled]="busy()" (click)="retry.emit()">{{ retryLabel() }}</button>
      }
    </div>
    <app-close-button class="close" label="Dismiss error" (pressed)="dismiss()" />
  </div>
}
