@if (state(); as s) {
  <div class="backdrop" (click)="cancelled.emit()"></div>
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 class="title">{{ s.title }}</h3>
    @if (s.label) {
      <p class="label">{{ s.label }}</p>
    }
    @if (options().length > 0) {
      <div class="options" role="radiogroup">
        @for (option of options(); track option.value) {
          <button
            type="button"
            class="option"
            role="radio"
            [attr.aria-checked]="choice() === option.value"
            [class.selected]="choice() === option.value"
            [class.danger]="option.danger"
            (click)="choose(option)"
            (dblclick)="confirm()"
          >
            <span class="option-radio" aria-hidden="true"></span>
            <span class="option-text">
              <span class="option-label">{{ option.label }}</span>
              @if (option.description) {
                <span class="option-description">{{ option.description }}</span>
              }
            </span>
          </button>
        }
      </div>
    } @else if (!s.confirmOnly) {
      <label class="sr-only" for="prompt-input">{{ s.label || s.title }}</label>
      <input
        id="prompt-input"
        #inputEl
        class="input"
        type="text"
        [value]="value()"
        placeholder=" "
        [attr.placeholder]="s.placeholder || ' '"
        [attr.aria-label]="s.label || s.title"
        title="Enter a value"
        (input)="onInput($event)"
        (keydown.enter)="confirm()"
      />
    }
    <div class="actions">
      <button class="btn" type="button" (click)="cancelled.emit()">Cancel</button>
      <button
        class="btn btn-primary"
        type="button"
        [class.btn-danger]="s.danger"
        [disabled]="options().length === 0 && !s.confirmOnly && !s.allowEmpty && !value().trim()"
        (click)="confirm()"
      >
        {{ s.okLabel || 'OK' }}
      </button>
    </div>
  </div>
}
