<div class="toolbar">
  <div class="group">
    <button
      type="button"
      class="icon-btn"
      title="Toggle Branches, Stashes and Worktrees panel"
      aria-label="Toggle repository panel"
      [attr.aria-expanded]="panelOpen()"
      (click)="menuToggle.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <span class="app-title">Guito</span>
  </div>

  <div class="group actions">
    <app-search-box
      [matchIndex]="matchIndex()"
      [matchCount]="matchCount()"
      [filterMode]="filterMode()"
      (filterModeChange)="filterModeChange.emit($event)"
      (searchChange)="searchChange.emit($event)"
      (searchNavigate)="searchNavigate.emit($event)"
    />

    <div class="action-menu">
      <button
        class="icon-btn"
        title="Fetch"
        [disabled]="busy()"
        [attr.aria-expanded]="openMenu() === 'fetch'"
        (click)="toggleMenu('fetch', $event)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
        </svg>
      </button>
      @if (openMenu() === 'fetch') {
        <div class="remote-menu" role="menu">
          <button type="button" role="menuitem" (click)="chooseRemoteAction('fetch')">Fetch</button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('fetch-prune')">
            Fetch (prune)
          </button>
        </div>
      }
    </div>

    <div class="action-menu">
      <button
        class="icon-btn"
        title="Pull"
        [disabled]="busy()"
        [attr.aria-expanded]="openMenu() === 'pull'"
        (click)="toggleMenu('pull', $event)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <polyline points="8 12 12 16 16 12" />
          <line x1="12" y1="8" x2="12" y2="16" />
        </svg>
      </button>
      @if (openMenu() === 'pull') {
        <div class="remote-menu" role="menu">
          <button type="button" role="menuitem" (click)="chooseRemoteAction('pull')">Pull</button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('pull-rebase')">Pull (rebase)</button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('rebase-from')">Rebase (from)...</button>
        </div>
      }
    </div>

    <div class="action-menu">
      <button
        class="icon-btn"
        title="Push"
        [disabled]="busy()"
        [attr.aria-expanded]="openMenu() === 'push'"
        (click)="toggleMenu('push', $event)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <polyline points="16 12 12 8 8 12" />
          <line x1="12" y1="16" x2="12" y2="8" />
        </svg>
      </button>
      @if (openMenu() === 'push') {
        <div class="remote-menu" role="menu">
          <button type="button" role="menuitem" (click)="chooseRemoteAction('push')">Push</button>
          <button
            type="button"
            role="menuitem"
            class="danger"
            (click)="chooseRemoteAction('push-force')"
          >
            Push (force)
          </button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('sync')">Sync</button>
          @if (prEnabled()) {
            <button
              type="button"
              role="menuitem"
              (click)="chooseRemoteAction('create-pr')"
            >
              Create Pull Request...
            </button>
          }
        </div>
      }
    </div>

    <button class="icon-btn" title="Refresh" (click)="refresh.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="23 4 23 10 17 10" />
        <polyline points="1 20 1 14 7 14" />
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
      </svg>
    </button>

    <div class="action-menu">
      <button
        class="icon-btn"
        title="Settings"
        [attr.aria-expanded]="openMenu() === 'settings'"
        (click)="toggleMenu('settings', $event)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
      @if (openMenu() === 'settings') {
        <div class="remote-menu" role="menu">
          <button type="button" role="menuitem" (click)="chooseSettingsAction('azure-url')">
            Azure DevOps URL...
          </button>
          <button type="button" role="menuitem" (click)="chooseSettingsAction('toggle-graph')">
            {{ showGraph() ? 'Hide Git Graph' : 'Show Git Graph' }}
          </button>
          <button type="button" role="menuitem" (click)="chooseSettingsAction('toggle-stashes')">
            {{ showStashes() ? 'Hide Stashes' : 'Show Stashes' }}
          </button>
          <button type="button" role="menuitem" (click)="chooseSettingsAction('toggle-file-view')">
            {{ fileListView() === 'tree' ? 'View Files as Flat List' : 'View Files as Tree' }}
          </button>
        </div>
      }
    </div>

    <div class="overflow-anchor">
      <button
        type="button"
        class="icon-btn overflow-btn"
        title="More actions"
        aria-label="More actions"
        aria-haspopup="menu"
        [attr.aria-expanded]="openMenu() === 'overflow'"
        (click)="toggleMenu('overflow', $event)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="2.1" />
          <circle cx="12" cy="12" r="2.1" />
          <circle cx="19" cy="12" r="2.1" />
        </svg>
      </button>
      @if (openMenu() === 'overflow') {
        <div class="remote-menu overflow-menu" role="menu">
          <button type="button" role="menuitem" (click)="chooseRemoteAction('fetch')">Fetch</button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('fetch-prune')">
            Fetch (prune)
          </button>
          <div class="menu-sep"></div>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('pull')">Pull</button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('pull-rebase')">
            Pull (rebase)
          </button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('rebase-from')">
            Rebase (from)...
          </button>
          <div class="menu-sep"></div>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('push')">Push</button>
          <button
            type="button"
            role="menuitem"
            class="danger"
            (click)="chooseRemoteAction('push-force')"
          >
            Push (force)
          </button>
          <button type="button" role="menuitem" (click)="chooseRemoteAction('sync')">Sync</button>
          @if (prEnabled()) {
            <button
              type="button"
              role="menuitem"
              (click)="chooseRemoteAction('create-pr')"
            >
              Create Pull Request...
            </button>
          }
          <div class="menu-sep"></div>
          <button type="button" role="menuitem" (click)="chooseRefresh()">Refresh</button>
          <div class="menu-sep"></div>
          <button type="button" role="menuitem" (click)="chooseSettingsAction('azure-url')">
            Azure DevOps URL...
          </button>
          <button type="button" role="menuitem" (click)="chooseSettingsAction('toggle-graph')">
            {{ showGraph() ? 'Hide Git Graph' : 'Show Git Graph' }}
          </button>
          <button type="button" role="menuitem" (click)="chooseSettingsAction('toggle-stashes')">
            {{ showStashes() ? 'Hide Stashes' : 'Show Stashes' }}
          </button>
          <button type="button" role="menuitem" (click)="chooseSettingsAction('toggle-file-view')">
            {{ fileListView() === 'tree' ? 'View Files as Flat List' : 'View Files as Tree' }}
          </button>
        </div>
      }
    </div>
  </div>
</div>
